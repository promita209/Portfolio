<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promita Ghorui - Creative Software Developer</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Raleway:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #4338ca;
            --accent-color: #818cf8;
            --text-color: #1f2937;
            --light-color: #ffffff;
            --background-color: #f3f4f6;
            --gradient: linear-gradient(135deg, #4f46e5, #818cf8);
            --shadow: 0 5px 15px rgba(79, 70, 229, 0.1);
            --shadow-strong: 0 10px 30px rgba(79, 70, 229, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Mobile Navigation */
        .mobile-nav-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            z-index: 1001;
        }

        .mobile-nav-toggle i {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        header {
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: var(--shadow);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            position: relative;
        }

        .logo {
            font-family: 'Raleway', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary-color);
            background-color: rgba(79, 70, 229, 0.1);
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: var(--light-color);
            position: relative;
            overflow: hidden;
            padding: 80px 0;
        }

        .hero-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .profile-container {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
            margin: 2rem 0;
        }

        .profile-picture {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: var(--shadow-strong);
        }

        .hero-text {
            flex: 2;
            min-width: 300px;
        }

        .hero-text h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 1rem;
        }

        .hero-text h2 {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .sections-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
        }

        .skills-grid, .projects-grid, .education-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
        }

        .skill-card, .project-card, .education-card {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .project-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
        }

        .contact-icons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 1rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .mobile-nav-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                position: fixed;
                top: 0;
                right: 0;
                height: 100vh;
                width: 70%;
                max-width: 300px;
                background: var(--light-color);
                flex-direction: column;
                padding: 80px 2rem;
                box-shadow: var(--shadow-strong);
                transform: translateX(100%);
                transition: transform 0.3s ease-in-out;
            }

            .nav-links.active {
                display: flex;
                transform: translateX(0);
            }

            .hero-content {
                flex-direction: column;
                text-align: center;
            }

            .profile-container {
                margin: 1rem 0;
            }

            .profile-picture {
                width: 200px;
                height: 200px;
            }

            .cta-buttons {
                justify-content: center;
            }

            .skills-grid, .projects-grid, .education-grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 1.8rem;
            }

            .contact-icons {
                gap: 1rem;
            }

            .social-link {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .hero-text h1 {
                font-size: 1.8rem;
            }

            .hero-text h2 {
                font-size: 1.3rem;
            }

            .profile-picture {
                width: 180px;
                height: 180px;
            }

            .cta-buttons {
                flex-direction: column;
                gap: 1rem;
            }

            .section-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="#" class="logo">Promita Ghorui</a>
            <button class="mobile-nav-toggle">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Rest of the HTML remains the same -->

    <script>
        // Mobile Navigation Toggle
        const mobileNavToggle = document.querySelector('.mobile-nav-toggle');
        const navLinks = document.querySelector('.nav-links');

        mobileNavToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            const icon = mobileNavToggle.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-times');
        });

        // Close mobile menu when clicking a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
                const icon = mobileNavToggle.querySelector('i');
                icon.classList.add('fa-bars');
                icon.classList.remove('fa-times');
            });
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!navLinks.contains(e.target) && !mobileNavToggle.contains(e.target)) {
                navLinks.classList.remove('active');
                const icon = mobileNavToggle.querySelector('i');
                icon.classList.add('fa-bars');
                icon.classList.remove('fa-times');
            }
        });
    </script>
</body>
</html>
